# Espace de travail Cargo (ADR-0006, décision 4). Les crates métier sont du Rust pur : aucune
# dépendance à wasm-bindgen, la liaison WebAssembly vivra dans des crates `-wasm` minces.
[workspace]
resolver = "3"
members = [
    "crates/pp-color",
    "crates/pp-color-wasm",
    "crates/pp-data",
    "crates/pp-data-wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/PaulPerigault/design-system"
publish = false

# Poids du `.wasm` (étape 8) : taille d'abord, pas de dépilage (aucun panic dans le code du dépôt).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

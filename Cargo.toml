# Espace de travail Cargo (ADR-0006, décision 4). Les crates métier sont du Rust pur : aucune
# dépendance à wasm-bindgen, la liaison WebAssembly vivra dans des crates `-wasm` minces.
[workspace]
resolver = "3"
members = [
    "crates/pp-color",
    "crates/pp-color-wasm",
    "crates/pp-data",
    "crates/pp-data-wasm",
    "crates/pp-milestones",
    "crates/pp-milestones-wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/PaulPerigault/design-system"
publish = false

# Poids du `.wasm` (étape 8) : taille d'abord, pas de dépilage (aucun panic dans le code du dépôt).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Scène de jalons (ADR-0012) : `opt-level` fixé par paquet, pour que le poids de ces deux crates ne
# dépende pas du profil racine et que les `.wasm` de pp-color et pp-data ne bougent pas.
# Mesure du 2026-11-21 (ADR-0013, .wasm après wasm-opt -Oz, brotli) : « s » 31 992 o, « z » 32 221 o ;
# avant wasm-opt : « s » 41 624 o, « z » 42 988 o. La plus petite l'emporte : « s ». Le choix se
# refait à chaque changement important du code des crates (voir leurs README).
[profile.release.package.pp-milestones]
opt-level = "s"

[profile.release.package.pp-milestones-wasm]
opt-level = "s"

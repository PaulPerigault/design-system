version: 2
# Mises à jour : regroupées par écosystème. Correctifs et versions mineures fusionnés
# automatiquement dans `develop` quand la CI est verte (workflow dependabot-automerge) ; versions
# majeures en PR séparées, à relire. Une version publiée depuis moins de 3 jours (7 pour une
# majeure) n'est pas adoptée : délai de réaction aux paquets compromis.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 8
    target-branch: develop
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    labels: ['dependencies']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
        update-types: ['minor', 'patch']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
        update-types: ['minor', 'patch']
      mcp:
        patterns: ['@modelcontextprotocol/*', 'zod']
        update-types: ['minor', 'patch']
      tests:
        patterns: ['vitest', '@vitest/*', '@playwright/*', 'playwright*', '@axe-core/*']
        update-types: ['minor', 'patch']
      tooling:
        patterns: ['*']
        exclude-patterns:
          - 'astro'
          - '@astrojs/*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - '@modelcontextprotocol/*'
          - 'zod'
          - 'vitest'
          - '@vitest/*'
          - '@playwright/*'
          - 'playwright*'
          - '@axe-core/*'
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    target-branch: develop
    commit-message:
      prefix: 'chore(ci)'
    labels: ['dependencies']
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']

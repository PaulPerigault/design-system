name: Installation
description: Node de .nvmrc, cache npm, puis npm ci sans scripts (installation unique de la CI).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci --ignore-scripts
      shell: bash

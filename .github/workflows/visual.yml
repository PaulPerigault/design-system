name: Visuel

# Régression visuelle (gap.md n° 20). PROVISOIRE (D-029, étape 1bis-b1) : tant que les captures de
# référence Linux n'existent pas (réparation en 1bis-b2), ce workflow n'est exigé par aucun check
# (le job agrégé `ci` ne l'attend pas) et ne tourne qu'à la main (workflow_dispatch) et chaque
# lundi à 05:00 UTC, jamais sur une PR ni sur un push. Les références sont recréées à chaque
# passage et mises en cache par appareil ; les différences sont téléversées pour relecture.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visuel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - matrice-360x800
          - matrice-375x667
          - matrice-393x852
          - matrice-430x932
          - matrice-360x800-paysage
          - matrice-375x667-paysage
          - matrice-393x852-paysage
          - matrice-430x932-paysage
          - matrice-tablette-820x1180
          - matrice-bureau-1280x800
          - matrice-bureau-1440x900
          - matrice-bureau-1920x1080
          - matrice-360x800-mouvement-reduit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: npm run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.visual
          key: visual-${{ matrix.project }}-${{ github.sha }}
          restore-keys: visual-${{ matrix.project }}-
      - name: captures
        env:
          PP_VISUAL: '1'
          PROJECT: ${{ matrix.project }}
          SNAPSHOTS: all
        run: >
          npx playwright test -c apps/docs/playwright.config.ts
          --project="$PROJECT" visual.spec.ts --update-snapshots="$SNAPSHOTS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visuel-${{ matrix.project }}
          path: apps/docs/test-results
          retention-days: 7

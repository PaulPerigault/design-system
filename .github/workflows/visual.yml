name: Visuel

# Régression visuelle (gap.md n° 20) : captures pleine page de chaque page et de chaque thème,
# comparées aux références Linux versionnées dans apps/docs/e2e/references. Projets : VISUAL_PROJECTS
# (apps/docs/e2e/devices.ts). Appelé par `ci` sur les PR de rendu ; lancé à la main avec `update`
# pour régénérer les références (artefact `visuel-references`, à committer par PR : procédure dans
# docs/process/visual-references.md) ; chaque lundi 05:00 UTC en comparaison.

on:
  workflow_dispatch:
    inputs:
      update:
        description: Régénérer les références au lieu de les comparer
        type: boolean
        default: false
  workflow_call:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  visuel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: npm run build
      - name: captures
        env:
          PP_VISUAL: '1'
          UPDATE: ${{ inputs.update && 'all' || 'none' }}
        run: npx playwright test -c apps/docs/playwright.config.ts visual.spec.ts --update-snapshots="$UPDATE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && inputs.update }}
        with:
          name: visuel-references
          path: apps/docs/e2e/references
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visuel-differences
          path: apps/docs/test-results
          retention-days: 7

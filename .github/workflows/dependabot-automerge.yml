name: Dependabot auto-merge

# Active la fusion automatique (squash) des PR Dependabot de correctif ou de version mineure vers
# `main`. GitHub ne fusionne qu'une fois les vérifications requises du ruleset passées. Les
# versions majeures ne sont jamais fusionnées ici : relecture humaine.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: fusion automatique (correctif et mineure)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

name: CI

on:
  pull_request:
    branches: [main]
    # `edited` : le titre et le corps de la PR (futur message de squash) sont revérifiés après
    # modification ; sans lui, le contrôle reste sur l'ancien texte.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Passage complet hebdomadaire (lundi 04:00 UTC) et déclenchement manuel avant la prod : e2e sur
  # toute la matrice. Jamais de e2e sur un push vers `main` : il a déjà tourné sur la PR (D-029).
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Une modification du titre ou du corps (`edited`) a son propre groupe : elle n'annule plus un e2e
# en cours sur la même PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: true

jobs:
  commitlint:
    # Titre + corps de la PR : c'est le message du commit de squash. Les commits de la branche ne
    # sont pas contrôlés (ils disparaissent au squash ; le hook commit-msg les vérifie en local).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: titre et corps de la PR (futur message de squash)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | npx --no -- commitlint --verbose

  squash-message:
    # D-004 : sur `main`, relit le commit de squash créé par GitHub (sujet et corps : conventions
    # et aucune signature d'outil ; un `Co-authored-by` ajouté par GitHub signale un auteur git
    # différent du compte qui fusionne). Le suffixe « (#n) » ajouté par GitHub au sujet est retiré
    # avant le contrôle : la limite de 72 caractères porte sur le titre de la PR. Fusionner avec
    # `gh pr merge --squash --subject --body-file` (AGENTS.md), sinon le corps est la liste des commits.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: message du dernier commit de main
        run: git log -1 --format=%B | sed -E '1s/ \(#[0-9]+\)$//' | npx --no -- commitlint --verbose

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run verify

  docs:
    # Même commande que Cloudflare Pages (docs/process/previews.md) : sans `dist/` préalable, elle
    # doit se suffire à elle-même. `verify` et `e2e` compilent tout avant la doc et masqueraient
    # un `prebuild` manquant (D-048).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npm -w @paulperigault/docs run build

  changes:
    # Décide si e2e tourne et sur quel périmètre. `render` : la PR touche le rendu (css, tokens,
    # astro, apps, dépendance de rendu pour Dependabot). `full` : toute la matrice d'appareils
    # (déclenchement manuel, cron, PR de release-please). Jamais sur un push (D-029).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      render: ${{ steps.diff.outputs.render }}
      full: ${{ steps.diff.outputs.full }}
      rust: ${{ steps.diff.outputs.rust }}
      wasm: ${{ steps.diff.outputs.wasm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          render=false
          full=false
          rust=false
          wasm=false
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = schedule ]; then
            render=true; full=true; rust=true; wasm=true
          elif [ "$EVENT" = pull_request ]; then
            if [[ "$HEAD_REF" == release-please--* ]]; then
              render=true; full=true
            elif git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(packages/(css|tokens|astro)/|apps/)'; then
              render=true
            elif [[ "$HEAD_REF" =~ ^dependabot/.*(astro|tailwind|vite|playwright|axe-core|pagefind|fontkit) ]]; then
              render=true
            fi
            # Rust : seulement les PR qui touchent un crate, sa chaîne, ce workflow, la référence
            # TypeScript de la parité (packages/tokens/src, packages/dataviz/src) ou ses vecteurs
            # (tools/color, tools/data). Les autres
            # PR ne paient ni l'installation de cargo-audit et cargo-deny ni la compilation.
            rust_paths='^(crates/|packages/(tokens|dataviz)/src/|tools/(color|data)/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|deny\.toml$|\.github/workflows/ci\.yml$)'
            if git diff --name-only "$BASE_SHA" HEAD | grep -Eq "$rust_paths"; then
              rust=true
            fi
            # Paquets WebAssembly : les crates, les références de la parité, les paquets, leurs vecteurs, le
            # SBOM et ce workflow ou la publication (qui construit aussi le .wasm).
            wasm_paths='^(crates/|packages/(color|data)/|packages/(tokens|dataviz)/src/|tools/(color|data|release)/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/(ci|release)\.yml$)'
            if git diff --name-only "$BASE_SHA" HEAD | grep -Eq "$wasm_paths"; then
              wasm=true
            fi
          fi
          echo "render=$render" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "wasm=$wasm" >> "$GITHUB_OUTPUT"

  e2e:
    # Documentation construite puis testée dans Chromium : axe (WCAG 2.2 AA), 1.4.12, 2.5.8,
    # mouvement réduit. Sur une PR de rendu : projet `chromium` + deux appareils de référence
    # (mobile 375x667, bureau 1280x800). Matrice complète (13 appareils) quand `full`.
    needs: changes
    if: needs.changes.outputs.render == 'true' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: npm run build
      - name: e2e
        env:
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$FULL" = true ]; then
            npm run e2e
          else
            npm run e2e -- --project=chromium --project=matrice-375x667 --project=matrice-bureau-1280x800
          fi

  rust:
    # Crates Rust (ADR-0006, décision 4) : format, clippy pedantic en refus, tests, puis RustSec et
    # cargo-deny. Seulement si `changes` voit un chemin Rust (et chaque lundi : nouvelles failles
    # RustSec) ; sauté, il compte comme réussi dans l'agrégat `ci`. Le build Cloudflare n'en dépend
    # pas : il ne lance ni cargo ni rustup. La chaîne vient de rust-toolchain.toml (rustup de l'image).
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -W clippy::pedantic
      - run: cargo test --workspace --locked
      - name: cargo-audit et cargo-deny (versions épinglées, Cargo.lock respecté)
        run: cargo install --locked cargo-audit@0.22.2 cargo-deny@0.20.2
      - run: cargo audit
      - run: cargo deny check

  wasm:
    # Paquets @paulperigault/color et @paulperigault/data (D-091 à D-094, D-100) : les .wasm sont compilés ici, jamais
    # commité. Construit, puis parité et contrat rejoués contre le paquet construit (PP_COLOR_WASM
    # impose le .wasm : absent, le test échoue au lieu de sauter), empreinte SHA-256, poids et
    # temps de chargement affichés (jamais bloquants), SBOM avec le .wasm. Mêmes conditions que
    # `rust` ; sauté, il compte comme réussi dans l'agrégat `ci`. Le build Cloudflare n'en dépend pas.
    needs: changes
    if: needs.changes.outputs.wasm == 'true' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Même version que la dépendance `wasm-bindgen` de Cargo.toml (l'outil refuse tout écart).
      - run: cargo install --locked wasm-bindgen-cli@0.2.130
      - run: npm -w @paulperigault/tokens run build && npm -w @paulperigault/dataviz run build
      - run: npm -w @paulperigault/color run build && npm -w @paulperigault/data run build
      - run: npm -w @paulperigault/color run build:wasm && npm -w @paulperigault/data run build:wasm
      - run: npm -w @paulperigault/color run check:wasm && npm -w @paulperigault/data run check:wasm
      - name: parité et contrat du paquet construit
        env:
          PP_COLOR_WASM: required
          PP_DATA_WASM: required
        run: npx vitest run --project color --project data
      - run: npm -w @paulperigault/color run measure && npm -w @paulperigault/data run measure
      - run: node tools/release/sbom.mjs sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: |
            packages/color/wasm/
            packages/data/wasm/
            sbom/paulperigault-color.cdx.json
            sbom/paulperigault-data.cdx.json
          retention-days: 30

  visuel:
    # Régression visuelle : captures comparées aux références Linux versionnées (workflow Visuel).
    # Seulement sur une PR de rendu ; jamais sur un push ni quand seul le titre est modifié (D-029).
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.render == 'true' && github.event.action != 'edited'
    uses: ./.github/workflows/visual.yml

  site:
    # Génère un site consommateur avec la CLI, l'installe sur les paquets du commit, puis verify.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: compilation de guards (dist/)
        run: npm -w @paulperigault/guards run build
      - name: paquets du commit
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          npm pack --pack-destination "$RUNNER_TEMP/packs" \
            -w @paulperigault/tokens -w @paulperigault/css -w @paulperigault/guards -w @paulperigault/mcp
      - name: site généré
        run: node packages/create/src/infrastructure/bin.ts create "$RUNNER_TEMP/site"
      - name: installation sur les tarballs
        working-directory: ${{ runner.temp }}/site
        run: |
          git init -q
          npm install --no-audit --no-fund "$RUNNER_TEMP"/packs/*.tgz
      - name: verify du site
        working-directory: ${{ runner.temp }}/site
        run: npm run verify

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          min-severity: medium

  ci:
    # Check requis unique : vert seulement si aucun job n'a échoué ni été annulé, les jobs sautés à
    # bon droit comptant comme réussis. `!cancelled()` plutôt que `always()` : quand la concurrence
    # annule tout le run, `ci` est annulé lui aussi (pas rouge) ; le run suivant porte le verdict.
    if: ${{ !cancelled() }}
    needs:
      [commitlint, squash-message, changes, verify, docs, e2e, rust, wasm, visuel, site, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      checks: read
    steps:
      - name: e2e et visuel du run de code (run edited)
        # Un run `edited` saute e2e et visuel et publierait un `ci` vert qui masque le run de code
        # encore en cours ou rouge sur le même SHA : on attend leur verdict.
        if: ${{ github.event.action == 'edited' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 180); do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
              --jq '.check_runs[] | select(.name == "e2e" or (.name | startswith("visuel"))) | "\(.status) \(.conclusion)"')
            if echo "$runs" | grep -Eq 'failure|cancelled|timed_out'; then echo "$runs"; exit 1; fi
            # Vide : le run de code n'a pas encore créé e2e/visuel (job `changes`) ou la PR ne
            # touche pas le rendu ; on laisse deux minutes avant de conclure à l'absence.
            if [ -z "$runs" ] && [ "$i" -lt 8 ]; then sleep 15; continue; fi
            if ! echo "$runs" | grep -Eq 'queued|in_progress|waiting'; then exit 0; fi
            sleep 15
          done
          echo "e2e ou visuel toujours en cours" && exit 1
      - name: agrégat
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then exit 1; fi

name: CI

on:
  pull_request:
    branches: [develop, main]
    # `edited` : le titre et le corps de la PR (futur message de squash) sont revérifiés après
    # modification ; sans lui, le contrôle reste sur l'ancien texte.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    # Chaque commit de la PR, puis titre + corps de la PR (le message de squash = corps de la PR) :
    # Conventional Commits et aucune signature d'outil, sans exemption.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: commits de la PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: titre et corps de la PR (futur message de squash)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | npx --no -- commitlint --verbose

  squash-message:
    # D-004 : sur `develop`, relit le commit de squash créé par GitHub (conventions et aucune
    # signature d'outil ; un `Co-authored-by` ajouté par GitHub signale un auteur git différent du
    # compte qui fusionne).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: message du dernier commit de develop
        run: npx --no -- commitlint --from HEAD~1 --to HEAD --verbose

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify

  e2e:
    # Documentation construite puis testée dans Chromium : axe (WCAG 2.2 AA), 1.4.12, 2.5.8,
    # mouvement réduit.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e

  site:
    # Génère un site consommateur avec la CLI, l'installe sur les paquets du commit, puis verify.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: paquets du commit
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          npm pack --pack-destination "$RUNNER_TEMP/packs" \
            -w @paulperigault/tokens -w @paulperigault/css -w @paulperigault/guards
      - name: site généré
        run: node packages/create/bin/pp-create.mjs create "$RUNNER_TEMP/site"
      - name: installation sur les tarballs
        working-directory: ${{ runner.temp }}/site
        run: |
          git init -q
          npm install --no-audit --no-fund "$RUNNER_TEMP"/packs/*.tgz
      - name: verify du site
        working-directory: ${{ runner.temp }}/site
        run: npm run verify

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          min-severity: medium

  ci:
    # Check requis unique : vert seulement si tous les jobs précédents le sont (ou sautés à bon droit).
    if: always()
    needs: [commitlint, squash-message, verify, e2e, site, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: agrégat
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then exit 1; fi

name: Release

# Inerte tant que `main` n'existe pas (créée par l'apply OpenTofu du propriétaire, avec ses
# rulesets). Seul ce workflow publie : trusted publishing OIDC + provenance, aucun NPM_TOKEN.
on:
  push:
    branches: [main]

permissions: {}

# Jamais annulé en cours : release-please pourrait laisser un tag sans release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          # Jeton dédié : les PR créées avec GITHUB_TOKEN ne déclenchent pas `ci`.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Environnement protégé (IaC, infra/github du portfolio) : déploiement depuis main seulement.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Provenance des dépendances et SBOM CycloneDX de la version publiée.
      - run: npm audit signatures
      - run: node tools/release/sbom.mjs sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom/
          retention-days: 90
      # Publie chaque paquet dont la version n'existe pas encore sur npmjs ; préversion → tag next.
      - run: node tools/release/publish-new.mjs

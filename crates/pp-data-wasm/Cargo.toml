[package]
name = "pp-data-wasm"
description = "Liaison WebAssembly de pp-data : conversion des types, aucune logique."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib : le `.wasm`. rlib : clippy et les tests du dépôt compilent aussi sur l'hôte.
crate-type = ["cdylib", "rlib"]

[dependencies]
pp-data = { path = "../pp-data" }
wasm-bindgen = "=0.2.130"

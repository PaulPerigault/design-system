[package]
name = "pp-milestones"
description = "Scène de jalons : modèle, géométrie, caméra, animation, interaction et thème, en Rust pur."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pp-color = { path = "../pp-color" }
# f32 seulement (aucun type entier ni f64 de glam) : le `.wasm` n'en paie pas le poids.
glam = { version = "=0.34.3", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

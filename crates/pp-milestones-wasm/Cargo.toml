[package]
name = "pp-milestones-wasm"
description = "Liaison WebGL2 de pp-milestones : appels de plateforme, aucune logique métier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib : le `.wasm`. rlib : clippy et les tests du dépôt compilent aussi sur l'hôte.
crate-type = ["cdylib", "rlib"]

[dependencies]
pp-milestones = { path = "../pp-milestones" }
wasm-bindgen = "=0.2.130"
# Une feature par type utilisé : presque toute l'API de web-sys est derrière des features, ce qui
# borne aussi le poids du `.wasm`. Version alignée sur wasm-bindgen 0.2.130.
web-sys = { version = "=0.3.107", features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlContextAttributes",
    "WebGlPowerPreference",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "WebglLoseContext",
] }
